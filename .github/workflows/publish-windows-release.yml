name: Publish approved Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag to package (for example v0.15.1)
        required: true
        type: string
      confirmation:
        description: Type PUBLISH ANCERYX WINDOWS RELEASE
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-release:
    if: vars.ANCERYX_PUBLIC_RELEASE_ENABLED == 'true' && inputs.confirmation == 'PUBLISH ANCERYX WINDOWS RELEASE'
    environment: public-release
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Validate release tag and repository visibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not ($env:TAG -match '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(beta|rc)\.(0|[1-9]\d*))?$')) { throw 'Tag must be a stable, beta, or rc SemVer tag.' }
          $visibility = gh api "repos/$env:GITHUB_REPOSITORY" --jq .visibility
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify repository visibility.' }
          if ($visibility -ne 'public') { throw 'Repository must be public before release publication is enabled.' }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'The reviewed release tag does not exist.' }
          $releaseLookup = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>&1
          $releaseLookupExitCode = $LASTEXITCODE
          if ($releaseLookupExitCode -eq 0 -and $releaseLookup -ne 'true') { throw 'An existing release for this tag is already published.' }
          if ($releaseLookupExitCode -ne 0 -and ($releaseLookup -join "`n") -notmatch '(?i)(HTTP 404|\bNot Found\b|release not found)') { throw 'Could not verify whether a release already exists for this tag.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate tag, version, and ancestry
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main for ancestry validation.' }
          $tagCommit = git rev-list -n 1 $env:TAG
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) { throw 'Could not resolve the release tag commit.' }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag is not reachable from main.' }
          $tagVersion = $env:TAG.Substring(1)
          $packageVersion = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package.json version.' }
          if ($tagVersion -ne $packageVersion) { throw "Tag version $tagVersion does not match package.json $packageVersion." }
      - name: Install dependencies
        run: npm ci
      - name: Check workflow fail-fast regression
        run: npm run test:workflow-fail-fast
      - name: Require pinned Ed25519 trust and protected signing key
        shell: pwsh
        env:
          ANCERYX_UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.ANCERYX_UPDATE_MANIFEST_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --experimental-strip-types scripts/check-update-release-prerequisites.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the Windows Electron runtime
        run: node node_modules/electron/install.js
      - name: Typecheck
        run: npm run typecheck
      - name: Build application
        run: npm run build
      - name: Audit dependency licenses
        run: npm run audit:licenses
      - name: Test license policy
        run: npm run test:license-audit
      - name: Test updater security
        run: npm run test:update-security
      - name: Test connection and updater configuration
        run: npm run test:connection-config
      - name: Test text encoding
        run: npm run test:encoding
      - name: Test Electron safe storage
        run: npm run test:electron-safe-storage
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build unsigned NSIS installer and create signed update manifest
        shell: pwsh
        env:
          ANCERYX_UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.ANCERYX_UPDATE_MANIFEST_PRIVATE_KEY }}
        run: |
          npx electron-builder --win nsis --publish never --config.win.verifyUpdateCodeSignature=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types scripts/create-update-manifest.mjs "dist/Anceryx-Setup-$version.exe" "dist/update-manifest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify unsigned installer and signed update metadata
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $version = $env:TAG.Substring(1)
          $installer = Get-Item "dist/Anceryx-Setup-$version.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'NotSigned') { throw "Expected an unsigned installer; signature status is $($signature.Status)." }
          $manifest = Get-Item 'dist/update-manifest.json'
          node --experimental-strip-types scripts/verify-update-manifest.mjs $manifest.FullName $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Signed update manifest verification failed.' }
          if (-not (Test-Path "dist/$($installer.Name).blockmap")) { throw 'NSIS blockmap is missing.' }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item $installer.FullName release-assets/
          Copy-Item "dist/$($installer.Name).blockmap" release-assets/
          Copy-Item $manifest.FullName release-assets/
          $checksumFiles = @($installer.FullName, "dist/$($installer.Name).blockmap", $manifest.FullName)
          $checksumLines = foreach ($file in $checksumFiles) {
            $hash = Get-FileHash -LiteralPath $file -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file))"
          }
          $checksumLines | Set-Content -LiteralPath 'release-assets/SHA256SUMS.txt' -Encoding ascii
          if ($version -match '-beta\.') { $channel = 'beta' } else { $channel = 'latest' }
          "Verified release channel: $channel" | Out-File -FilePath release-assets/release-channel.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-${{ inputs.tag }}
          retention-days: 3
          if-no-files-found: error
          path: release-assets/*

  publish-release:
    needs: build-release
    if: needs.build-release.result == 'success'
    environment: public-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release-${{ inputs.tag }}
          path: release-files
      - name: Ensure tag has no existing release, then publish exact artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = 'PUBLISH ANCERYX WINDOWS RELEASE'
          gh api "repos/$GITHUB_REPOSITORY" --jq .visibility | grep -qx public
          channel=$(cat release-files/release-channel.txt)
          test -n "$channel"
          mapfile -t assets < <(find release-files -maxdepth 1 -type f \( -name '*.exe' -o -name '*.blockmap' -o -name 'update-manifest.json' -o -name 'SHA256SUMS.txt' \) | sort)
          test "${#assets[@]}" -ge 4
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          if [[ "$channel" == 'Verified release channel: latest' ]]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Anceryx $TAG" --draft=false --latest
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Anceryx $TAG" --draft=false --prerelease
            fi
          elif [[ "$channel" == 'Verified release channel: latest' ]]; then
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Anceryx $TAG" --notes-from-tag --latest
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Anceryx $TAG" --notes-from-tag --prerelease
          fi
