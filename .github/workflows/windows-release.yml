name: Windows release artifacts

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, SHA de commit ou tag versionada (por exemplo, v0.15.0)
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Validate selected tag version
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          ./scripts/validate-release-source.ps1

      - name: Test release source validation
        shell: pwsh
        run: ./scripts/validate-release-source.test.ps1

      - name: Set artifact source label
        id: source
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $label = $env:SOURCE_REF -replace '^refs/tags/', ''
          $label = $label -replace '[^A-Za-z0-9._-]', '-'
          "label=$label" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Electron runtime for Windows security checks
        run: node node_modules/electron/install.js

      - name: Validate root
        run: |
          npm run typecheck
          npm run build
          npm run audit:licenses
          npm run test:license-audit
          npm run test:update-security
          npm run test:connection-config
          npm run test:encoding
          npm audit --omit=dev --audit-level=moderate

      - name: Run Windows and release security checks
        shell: pwsh
        run: |
          npm run test:electron-safe-storage

      - name: Build Windows NSIS without publishing
        env:
          # electron:build already invokes electron-builder with --publish never.
          # Keep publisher credentials unavailable to this review-only build.
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: npm run electron:build

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anceryx-windows-${{ steps.source.outputs.label }}
          retention-days: 3
          # Metadata/blockmaps are optional until an approved publish/feed
          # configuration is supplied; never turn a review build into a
          # publication requirement.
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
            dist/*.json

# This workflow only creates review artifacts when manually dispatched. Tags
# do not build or upload installers automatically. It never creates a GitHub
# Release or uploads to the update server. Publication requires the separate,
# manually approved workflow and protected GitHub Environments.
